# ==============================================================================
# pyproject.toml - Central Configuration and Python Build Standard (PEP 517/518/621)
# ==============================================================================
# This file replaces the legacy format (setup.py, setup.cfg and requirements.txt),
# unifying metadata, dependencies, entry-point scripts and build configuration.

[build-system]
# Defines the tool that builds and installs the package.
# setuptools is the robust standard for pure Python; once Rust extensions are added,
# it can be replaced or complemented with 'maturin' (PEP 517).
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicmatch"
version = "0.2.0"
description = "AI-Native local music management, curation, and DSP playback system for large-scale audio libraries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.6"
authors = [
    { name = "Icaro Saggioro", email = "icaro.saggioro@gmail.com" }
]
keywords = ["audio", "ai-agents", "mp3", "dsp", "music", "gemini"]

# Required runtime dependencies
dependencies = [
    "google-genai>=0.1.0",
    "mediafile>=0.17.0",
    "pyacoustid>=1.3.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "send2trash>=1.8.0",
    "yt-dlp>=2025.01.01",
]

[project.optional-dependencies]
# Optional dependencies for testing and code quality
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
# Creates the global 'musicmatch' terminal command
musicmatch = "musicmatch.cli:main"

[tool.setuptools.packages.find]
# Automatically discover every subpackage inside the 'src' directory
where = ["src"]

[tool.pytest.ini_options]
# Explicit loop scope for async fixtures (silences the pytest-asyncio deprecation warning).
asyncio_default_fixture_loop_scope = "function"
